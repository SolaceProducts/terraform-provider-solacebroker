version: 3

project:
  name: terraform-provider-solacebroker
  teams: []
  labels:
    - go-dependencies
    - terraform-provider
    - EBP-Container

vendoredDependencies:
  forceRescans: false
  scanMethod: CLILicenseScan
  licenseScanPathFilters:
    only:
      - "**/LICENSE"
    exclude:
      - "./.git"
      - "./.github"

paths:
  exclude:
    - ./.git
    - ./.github

telemetry:
  scope: full
