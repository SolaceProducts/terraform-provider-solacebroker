name: Provider Acceptance Test

on:
  workflow_call:
    inputs:
      provider-ref:
        type: string
        default: ""
      generated-artifact:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Run formal acceptance test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SolaceProducts/terraform-provider-solacebroker
          ref: ${{ inputs.provider-ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Remove committed tree before unpacking the generated one
        if: inputs.generated-artifact != ''
        run: rm -rf internal/broker/generated docs

      - name: Unpack generated tree
        if: inputs.generated-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.generated-artifact }}
          path: .

      - name: Acceptance test
        run: |
          make testacc