name: Provider Acceptance Test

on:
  workflow_call:
    inputs:
      provider-ref:
        type: string
        default: ""
      generated-artifact:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Run formal acceptance test
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"

      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SolaceDev/terraform-provider-solacebroker
          ref: ${{ inputs.provider-ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Remove committed tree before unpacking the generated one
        if: inputs.generated-artifact != ''
        run: rm -rf internal/broker/generated docs

      - name: Unpack generated tree
        if: inputs.generated-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.generated-artifact }}
          path: .

      - name: Acceptance test
        run: |
          make testacc