name: SCA Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sca_scan:
    # Fork and Dependabot PRs get no FOSSA_API_KEY and a read-only token. Dependency Review still checks their advisories;
    # their licences are only reported, on main after merge, until the Dependabot secret and the main waivers land.
    if: >-
      github.repository == 'SolaceProducts/terraform-provider-solacebroker' &&
      (github.event_name == 'push' ||
       (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    # The shared workflow inherits these: it posts FOSSA checks, statuses and PR comments.
    permissions:
      contents: read
      id-token: write
      packages: read
      actions: read
      statuses: write
      checks: write
      pull-requests: write
    uses: SolaceDev/solace-public-workflows/.github/workflows/sca-scan-and-guard.yaml@e76b739012f3cb3276d8d29c0e56a9e2a839f1d2 # main
    with:
      # shortcut: main still has 4 licences the FOSSA policy denies, so its full scan only reports licensing; drop this once they're waived.
      # PRs scan only their own changes, so a new licensing problem still blocks.
      fossa_licensing_mode: ${{ github.event_name == 'push' && 'REPORT' || '' }}
    secrets:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

  dependency_review:
    name: Dependencies free of high advisories
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # No checkout: the action compares base and head through the API.
      - name: Review dependency changes for known advisories
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Licence policy lives in FOSSA.
          license-check: false
          # Calls deps.dev live, so the verdict could change with no commit.
          show-openssf-scorecard: false
          # A fork PR's token can't comment; the verdict goes to the job summary.
          comment-summary-in-pr: never

  # The check the ruleset requires. Never skipped, so it reports on every PR.
  gate:
    name: SCA gate
    if: always()
    needs: [sca_scan, dependency_review]
    runs-on: ubuntu-latest
    steps:
      - name: Check the scans passed
        env:
          EVENT: ${{ github.event_name }}
          SCA: ${{ needs.sca_scan.result }}
          REVIEW: ${{ needs.dependency_review.result }}
        run: |
          echo "event=$EVENT sca_scan=$SCA dependency_review=$REVIEW"
          if [ "$EVENT" = pull_request ] && [ "$SCA" = skipped ]; then
            echo "::notice::FOSSA skipped: fork or Dependabot PR. Advisories are checked by Dependency Review; licences only after merge."
          elif [ "$SCA" != success ]; then
            exit 1
          fi
          if [ "$EVENT" = pull_request ] && [ "$REVIEW" != success ]; then exit 1; fi

  update_manifest:
    needs: sca_scan
    if: needs.sca_scan.result == 'success' && github.ref_name == github.event.repository.default_branch && github.repository == 'SolaceProducts/terraform-provider-solacebroker'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::868978040651:role/github-solace-cloud-manifest-rw
          aws-region: us-east-1

      - name: Update solace-cloud-manifest
        uses: SolaceDev/solace-public-workflows/.github/actions/cicd-helper@e76b739012f3cb3276d8d29c0e56a9e2a839f1d2 # main
        with:
          rc_step: add_item_from_json_to_dynamodb_table
          ddb_table_name: solace-cloud-manifest
          ddb_partition_key: squad
          ddb_sort_key: repository
          ddb_item_to_be_added: |
            {
              "squad": "ebp-dax",
              "repository": "${{ github.event.repository.name }}",
              "dev": {
                "sha": "${{ github.sha }}",
                "version": "${{ github.ref_name }}"
              }
            }
