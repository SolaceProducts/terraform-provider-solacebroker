name: SCA Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The shared workflow needs these scopes and tracks main. TF 15-S (SOL-156451) replaces this file, so its zizmor findings are ignored here.
permissions:
  contents: read
  id-token: write # zizmor: ignore[excessive-permissions]
  packages: read
  actions: read
  statuses: write # zizmor: ignore[excessive-permissions]
  checks: write # zizmor: ignore[excessive-permissions]
  pull-requests: write # zizmor: ignore[excessive-permissions]

jobs:
  sca_scan:
    # Fork and Dependabot PRs get no FOSSA_API_KEY and a read-only token; their changes are scanned on main after merge.
    if: >-
      github.repository == 'SolaceProducts/terraform-provider-solacebroker' &&
      (github.event_name == 'push' ||
       (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    uses: SolaceDev/solace-public-workflows/.github/workflows/sca-scan-and-guard.yaml@main # zizmor: ignore[unpinned-uses]
    secrets:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

  update_manifest:
    needs: sca_scan
    if: needs.sca_scan.result == 'success' && github.ref_name == github.event.repository.default_branch && github.repository == 'SolaceProducts/terraform-provider-solacebroker'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::868978040651:role/github-solace-cloud-manifest-rw
          aws-region: us-east-1

      - name: Update solace-cloud-manifest
        uses: SolaceDev/solace-public-workflows/.github/actions/cicd-helper@668d31d070ebdbbb5d6f2bdd13d406697055ae3c # main
        with:
          rc_step: add_item_from_json_to_dynamodb_table
          ddb_table_name: solace-cloud-manifest
          ddb_partition_key: squad
          ddb_sort_key: repository
          ddb_item_to_be_added: |
            {
              "squad": "ebp-dax",
              "repository": "${{ github.event.repository.name }}",
              "dev": {
                "sha": "${{ github.sha }}",
                "version": "${{ github.ref_name }}"
              }
            }
