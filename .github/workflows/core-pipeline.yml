name: Test Provider

on:
  pull_request:
    branches:
      - main
      - ci/pipeline-base
  merge_group:
  # Every branch (no tags) on ci/pipeline-base, so every branch cut from it runs the gate. TF 9-S sets this back to main.
  push:
    branches:
      - "**"
  workflow_call:
    inputs:
      provider-ref:
        type: string
        default: ""
      generated-artifact:
        type: string
        default: ""
      # The github context belongs to the caller under workflow_call, so this is the only way to tell the gate was called.
      called:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: core-pipeline-${{ inputs.called && format('{0}-{1}', github.run_id, inputs.generated-artifact) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.called && github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & test Terraform provider
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"

      # Under workflow_call the default repository is the caller's.
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SolaceDev/terraform-provider-solacebroker
          ref: ${{ inputs.provider-ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Remove committed tree before unpacking the generated one
        if: inputs.generated-artifact != ''
        run: rm -rf internal/broker/generated docs

      - name: Unpack generated tree
        if: inputs.generated-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.generated-artifact }}
          path: .

      - name: Check modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Build provider
        run: |
          make install
          ~/go/bin/terraform-provider-solacebroker version

  docs:
    name: Check docs are up to date
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"

      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SolaceDev/terraform-provider-solacebroker
          ref: ${{ inputs.provider-ref }}
          persist-credentials: false

      - name: Remove committed tree before unpacking the generated one
        if: inputs.generated-artifact != ''
        run: rm -rf internal/broker/generated docs

      - name: Unpack generated tree
        if: inputs.generated-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.generated-artifact }}
          path: .

      - name: Set up Terraform latest
        uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1 # v2
        with:
          terraform_wrapper: false

      # Staging first compares against the docs on disk, which are the unpacked ones when an artifact is named.
      - name: Generate docs and compare
        run: |
          git add -A docs/
          make generate-docs
          git diff --exit-code docs/
          untracked=$(git ls-files --others --exclude-standard docs/)
          if [ -n "$untracked" ]; then echo "$untracked"; exit 1; fi

  testacc:
    needs: build
    uses: ./.github/workflows/provider-acceptance-test.yml
    with:
      provider-ref: ${{ inputs.provider-ref }}
      generated-artifact: ${{ inputs.generated-artifact }}

  terraform:
    needs: build
    uses: ./.github/workflows/provider-test-pipeline.yml
    with:
      provider-ref: ${{ inputs.provider-ref }}
      generated-artifact: ${{ inputs.generated-artifact }}

  opentofu:
    needs: build
    uses: ./.github/workflows/provider-test-pipeline-opentofu.yml
    with:
      provider-ref: ${{ inputs.provider-ref }}
      generated-artifact: ${{ inputs.generated-artifact }}

  cli:
    needs: build
    uses: ./.github/workflows/cli-test-pipeline.yml
    with:
      provider-ref: ${{ inputs.provider-ref }}
      generated-artifact: ${{ inputs.generated-artifact }}

  # The only check the ruleset requires. Never skipped: red unless every job succeeded.
  gate:
    if: always()
    needs: [build, docs, testacc, terraform, opentofu, cli]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
